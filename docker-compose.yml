# PhotoTag stack for Portainer (Stacks → Add stack → Repository).
# Secrets come from environment variables set in Portainer; see .env.example and
# docs/deployment.md.
name: phototag

x-app: &app
  image: phototag:latest
  restart: unless-stopped
  # Match the owner of the NAS folders (OpenMediaVault: your user, group "users" = 100).
  user: "${PUID:-1000}:${PGID:-100}"
  environment: &app-env
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
    DATABASE_URL: postgres://phototag:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/phototag
    TZ: ${TZ:-Europe/Madrid}
    VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
  depends_on:
    db:
      condition: service_healthy

services:
  web:
    <<: *app
    # Only web builds the image; "build" makes every (re)deploy rebuild it from the
    # checked-out repository (layers are cached, so unchanged steps are fast).
    build:
      context: .
      target: runtime
    pull_policy: build
    command: ["web"]
    environment:
      <<: *app-env
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS is required}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?DJANGO_CSRF_TRUSTED_ORIGINS is required}
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-admin}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      DEFAULT_USER_PASSWORD: ${DEFAULT_USER_PASSWORD:?DEFAULT_USER_PASSWORD is required}
      FACE_MATCH_THRESHOLD: ${FACE_MATCH_THRESHOLD:-0.363}
    volumes:
      - ${HOST_PHOTOS_DIR:?HOST_PHOTOS_DIR is required}:/data/photos:ro
    networks: [internal, edge]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # No published ports: cloudflared reaches web through the Docker network.

  worker:
    <<: *app
    pull_policy: never  # uses the image built for web
    command: ["worker"]
    environment:
      <<: *app-env
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-60}
      MIN_PHOTO_AREA_RATIO: ${MIN_PHOTO_AREA_RATIO:-0.03}
      FACE_SCORE_THRESHOLD: ${FACE_SCORE_THRESHOLD:-0.7}
      EMBEDDING_POLL_SECONDS: ${EMBEDDING_POLL_SECONDS:-60}
      EXPORT_INTERVAL_HOURS: ${EXPORT_INTERVAL_HOURS:-0}
      NOTIFY_POLL_MINUTES: ${NOTIFY_POLL_MINUTES:-10}
      NOTIFY_MIN_INTERVAL_MINUTES: ${NOTIFY_MIN_INTERVAL_MINUTES:-60}
      NOTIFY_QUIET_HOURS: ${NOTIFY_QUIET_HOURS:-22-9}
    volumes:
      - ${HOST_SCANS_DIR:?HOST_SCANS_DIR is required}:/data/scans
      - ${HOST_PHOTOS_DIR}:/data/photos
      - ${HOST_EXPORT_DIR:?HOST_EXPORT_DIR is required}:/data/export
      - ${HOST_BACKUPS_DIR:?HOST_BACKUPS_DIR is required}:/data/backups
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy  # web applies the migrations
    # egress: outbound only, to deliver push notifications (no published ports).
    networks: [internal, egress]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: phototag
      POSTGRES_USER: phototag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Europe/Madrid}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phototag -d phototag"]
      interval: 10s
      timeout: 5s
      retries: 5

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN is required}
      TZ: ${TZ:-Europe/Madrid}
    depends_on:
      web:
        condition: service_healthy
    networks: [edge]

networks:
  # No external access: db and worker only live here.
  internal:
    internal: true
  # web <-> cloudflared; cloudflared needs outbound internet for the tunnel.
  edge: {}
  # Outbound internet for the worker (Web Push services). Nothing else joins it.
  egress: {}

volumes:
  pgdata:
