{% if page.has_other_pages %}
<nav class="pagination" aria-label="Paginación">
  {% if page.has_previous %}<a class="button small" href="?{% if query %}q={{ query|urlencode }}&{% endif %}{% if status %}status={{ status }}&{% endif %}page={{ page.previous_page_number }}">← Anterior</a>{% endif %}
  <span class="muted">Página {{ page.number }} de {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a class="button small" href="?{% if query %}q={{ query|urlencode }}&{% endif %}{% if status %}status={{ status }}&{% endif %}page={{ page.next_page_number }}">Siguiente →</a>{% endif %}
</nav>
{% endif %}
