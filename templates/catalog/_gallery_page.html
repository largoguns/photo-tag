{% for photo in page %}{% include "catalog/_photo_card.html" %}{% empty %}<li class="empty">No hay fotos con estos filtros.</li>{% endfor %}
{% if page.has_next %}
<li class="load-more" hx-get="{% url 'gallery' %}?{% if query %}{{ query }}&{% endif %}page={{ page.next_page_number }}" hx-trigger="revealed" hx-swap="outerHTML">
  <a class="button" href="{% url 'gallery' %}?{% if query %}{{ query }}&{% endif %}page={{ page.next_page_number }}">Cargar más</a>
</li>
{% endif %}
